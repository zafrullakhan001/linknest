; PHP Configuration for LinkNest Docker
; Enable SQLite extensions

; PDO SQLite extension (installed via docker-php-ext-install)
; The extension is automatically enabled when installed, but we ensure it here
; Note: docker-php-ext-install automatically enables extensions, but this ensures it's loaded

; Error reporting (for development - adjust for production)
display_errors=Off
log_errors=On
error_log=/var/log/apache2/php_errors.log

; Memory and execution limits
memory_limit=256M
max_execution_time=300
max_input_time=300

; File upload settings
upload_max_filesize=10M
post_max_size=10M

; Session settings
session.save_handler=files
session.save_path=/tmp

