; PHP Configuration for LinkNest Docker - Optimized for 1000+ Concurrent Users
; All required extensions are installed and enabled via docker-php-ext-install

; Error reporting (for production)
display_errors=Off
log_errors=On
error_log=/var/log/apache2/php_errors.log
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT

; Memory and execution limits (optimized for high concurrency)
memory_limit=512M
max_execution_time=300
max_input_time=300
max_input_vars=5000

; File upload settings
upload_max_filesize=50M
post_max_size=50M
file_uploads=On
max_file_uploads=50

; Session settings (optimized for high concurrency)
session.save_handler=files
session.save_path=/tmp
session.gc_maxlifetime=1440
session.gc_probability=1
session.gc_divisor=1000
session.cookie_httponly=1
session.cookie_secure=0
session.use_strict_mode=1

; OPcache settings - Optimized for 1000+ concurrent users
; High-performance configuration for production workloads
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.max_wasted_percentage=10
opcache.revalidate_freq=0
opcache.validate_timestamps=0
opcache.fast_shutdown=1
opcache.consistency_checks=0
opcache.optimization_level=0x7FFFBFFF
opcache.save_comments=1
opcache.enable_file_override=1
opcache.huge_code_pages=1

; Realpath cache for better performance (reduces filesystem calls)
realpath_cache_size=8192K
realpath_cache_ttl=3600

; Output buffering and compression
output_buffering=8192
zlib.output_compression=On
zlib.output_compression_level=6

; Date and timezone
; Timezone is set dynamically from system timezone or TZ environment variable
; This is handled by the entrypoint script and PHP will use the system timezone
; If you need to override, uncomment and set a specific timezone:
; date.timezone=America/New_York
; For list of timezones: https://www.php.net/manual/en/timezones.php

; Performance optimizations
allow_url_fopen=On
default_socket_timeout=60

; Disable unnecessary features for performance
expose_php=Off

