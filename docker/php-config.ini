; PHP Configuration for LinkNest Docker
; Enable SQLite extensions

; PDO SQLite extension (installed via docker-php-ext-install)
; The extension is automatically enabled when installed, but we ensure it here
; Note: docker-php-ext-install automatically enables extensions, but this ensures it's loaded

; Error reporting (for production)
display_errors=Off
log_errors=On
error_log=/var/log/apache2/php_errors.log
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT

; Memory and execution limits
memory_limit=256M
max_execution_time=300
max_input_time=300

; File upload settings
upload_max_filesize=10M
post_max_size=10M

; Session settings
session.save_handler=files
session.save_path=/tmp
session.gc_maxlifetime=1440

; OPcache settings for better PHP performance
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.revalidate_freq=2
opcache.fast_shutdown=1

; Realpath cache for better performance
realpath_cache_size=4096K
realpath_cache_ttl=600

; Output buffering
output_buffering=4096
zlib.output_compression=On

; Date and timezone
date.timezone=UTC

