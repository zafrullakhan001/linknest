version: '3.8'

services:
  linknest:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: linknest
    ports:
      - "8000:80"
    volumes:
      - ../data:/var/www/html/data
      - ../uploads:/var/www/html/uploads
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/settings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.linknest.rule=Host(`linknest.local`)"






