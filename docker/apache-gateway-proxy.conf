# LinkNest SSH/VNC gateway WebSocket proxy (include inside VirtualHost).
# Browsers on https://localhost:8443 reject self-signed wss:// on :18681/:18881.
# Terminate TLS at Apache and proxy to plain localhost ttyd/websockify.

ProxyRequests Off
ProxyPreserveHost Off
ProxyTimeout 3600

RewriteEngine On

# SSH ttyd (Docker range 18681-18780) → ws://127.0.0.1:<port>/...
RewriteCond %{HTTP:Upgrade} websocket [NC]
RewriteCond %{HTTP:Connection} upgrade [NC]
RewriteRule ^/_ln_sshgw/(1868[1-9]|1869[0-9]|187[0-7][0-9]|18780)/(.*)$ ws://127.0.0.1:$1/$2 [P,L]
RewriteRule ^/_ln_sshgw/(1868[1-9]|1869[0-9]|187[0-7][0-9]|18780)/(.*)$ http://127.0.0.1:$1/$2 [P,L]

# VNC websockify (Docker range 18881-18980) → ws://127.0.0.1:<port>/...
RewriteCond %{HTTP:Upgrade} websocket [NC]
RewriteCond %{HTTP:Connection} upgrade [NC]
RewriteRule ^/_ln_vncgw/(1888[1-9]|1889[0-9]|189[0-7][0-9]|18980)/(.*)$ ws://127.0.0.1:$1/$2 [P,L]
RewriteRule ^/_ln_vncgw/(1888[1-9]|1889[0-9]|189[0-7][0-9]|18980)/(.*)$ http://127.0.0.1:$1/$2 [P,L]
