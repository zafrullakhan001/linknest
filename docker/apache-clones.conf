# In-container clones: http://host:8090/{folder}/ → /var/www/clones/{folder}
# Reserved first-path segments stay on the main app DocumentRoot.
#
# Vite writes JS/CSS under dist/assets/, but the built HTML requests ./assets/.
# AliasMatch maps /{folder}/assets/... to a path that does not exist on disk, and
# Apache 404s before the clone .htaccess rewrite can run. Pass-through rewrite
# first so AliasMatch lands on dist/.

<IfModule mod_rewrite.c>
    RewriteEngine On
    # Pretty API URLs (/myspaces/api/settings) do not exist on disk. AliasMatch
    # 404s them as HTML before clone .htaccess can rewrite to api/index.php.
    RewriteCond %{REQUEST_URI} !/api/index\.php
    RewriteCond /var/www/clones/$1 -d
    RewriteCond /var/www/clones/$1/api/$2 !-f
    RewriteRule "^/(?!(?:api|uploads|dist|assets|land|extensions|docs|public|data|bin|scripts|vendor|node_modules|clones|html|_ln_sshgw|_ln_vncgw)(?:/|$))([A-Za-z0-9][A-Za-z0-9_-]*)/api(?:/(.*))?$" "/$1/api/index.php?path=$2" [PT,QSA,BCTLS]
    RewriteRule "^/(?!(?:api|uploads|dist|assets|land|extensions|docs|public|data|bin|scripts|vendor|node_modules|clones|html|_ln_sshgw|_ln_vncgw)(?:/|$))([A-Za-z0-9][A-Za-z0-9_-]*)/(assets|tinymce|js)/(.*)$" "/$1/dist/$2/$3" [PT]
    RewriteRule "^/(?!(?:api|uploads|dist|assets|land|extensions|docs|public|data|bin|scripts|vendor|node_modules|clones|html|_ln_sshgw|_ln_vncgw)(?:/|$))([A-Za-z0-9][A-Za-z0-9_-]*)/(ssh-session-shared-worker\.js|ssh-session-keepalive\.html|sw-cache-first\.js|tinymce-editor\.html)$" "/$1/dist/$2" [PT]
</IfModule>

AliasMatch "^/(?!(?:api|uploads|dist|assets|land|extensions|docs|public|data|bin|scripts|vendor|node_modules|clones|html|_ln_sshgw|_ln_vncgw)(?:/|$))([A-Za-z0-9][A-Za-z0-9_-]*)(/.*)?$" "/var/www/clones/$1$2"

<Directory /var/www/clones>
    Options -Indexes -MultiViews +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex dist/index.html index.html
    <IfModule mod_mime.c>
        AddType application/javascript .js
        AddType application/javascript .mjs
        AddType text/css .css
        AddType text/html .html
        AddType application/wasm .wasm
    </IfModule>
</Directory>
