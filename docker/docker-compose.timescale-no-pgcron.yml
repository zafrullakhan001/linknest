# PG-timescale WITHOUT pg_cron (use when you need to start immediately).
# Same volume/ports as docker-compose.timescale.yml; use after fix-timescale-config.ps1.
# To get pg_cron later: build and use docker-compose.timescale.yml instead.
#
# Start: docker compose -f docker/docker-compose.timescale-no-pgcron.yml up -d

services:
  PG-timescale:
    image: timescale/timescaledb:latest-pg18
    container_name: PG-timescale
    command: >
      postgres
      -c log_timezone=UTC
      -c TimeZone=UTC
      -c shared_preload_libraries=timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linknest_analytics
      PGTZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linknest_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  timescale_data:
