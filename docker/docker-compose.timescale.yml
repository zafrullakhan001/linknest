# TimescaleDB (PostgreSQL + TimescaleDB) for Performance Analytics add-on
# Includes pg_cron extension (built from Dockerfile.timescale-pgcron).
#
# Fix for "invalid value for parameter log_timezone: LOCAL" / "TimeZone: LOCAL":
# PostgreSQL 18 does not accept "LOCAL" for these parameters. This compose
# overrides them via command line so the server starts even if the data
# directory was initialized with an invalid timezone.
#
# Start:  docker compose -f docker/docker-compose.timescale.yml up -d
# Build:  docker compose -f docker/docker-compose.timescale.yml build
# Stop:   docker compose -f docker/docker-compose.timescale.yml down
# Logs:   docker compose -f docker/docker-compose.timescale.yml logs -f PG-timescale
#
# After first start, enable pg_cron in the database:
#   psql -h localhost -p 5433 -U postgres -d linknest_analytics -c "CREATE EXTENSION pg_cron;"

services:
  PG-timescale:
    build:
      context: .
      dockerfile: Dockerfile.timescale-pgcron
    image: timescale/timescaledb-pgcron:latest-pg18
    container_name: PG-timescale
    # Override timezone and enable pg_cron in shared_preload_libraries
    command: >
      postgres
      -c log_timezone=UTC
      -c TimeZone=UTC
      -c shared_preload_libraries=timescaledb,pg_cron
      -c cron.database_name=linknest_analytics
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linknest_analytics
      PGTZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linknest_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  timescale_data:
