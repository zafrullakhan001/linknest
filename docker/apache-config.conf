<VirtualHost *:80>
    # Accept any hostname (allows custom DNS names)
    # ServerName is required but ServerAlias * allows all hostnames
    ServerName localhost
    ServerAlias *
    ServerAdmin webmaster@localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}
    
    # Prevent canonical redirects - use the hostname from the request
    UseCanonicalName Off

    <Directory ${APACHE_DOCUMENT_ROOT}>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Set MIME types for all JavaScript files in root and subdirectories
        <IfModule mod_mime.c>
            AddType application/javascript .js
            AddType application/javascript .mjs
            AddType text/css .css
        </IfModule>
    </Directory>
    
    # Ensure root requests go to dist/index.html via DirectoryIndex
    <IfModule mod_dir.c>
        DirectoryIndex index.html dist/index.html
    </IfModule>
    
    # Ensure MIME types for dist directory - CRITICAL for module scripts
    <Directory ${APACHE_DOCUMENT_ROOT}/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        <IfModule mod_mime.c>
            AddType application/javascript .js
            AddType application/javascript .mjs
            AddType text/css .css
            AddType text/html .html
        </IfModule>
        <FilesMatch "\.js$">
            ForceType application/javascript
            Header set Content-Type "application/javascript; charset=utf-8"
        </FilesMatch>
        <FilesMatch "\.mjs$">
            ForceType application/javascript
            Header set Content-Type "application/javascript; charset=utf-8"
        </FilesMatch>
    </Directory>
    
    # Ensure MIME types for dist/assets directory
    <Directory ${APACHE_DOCUMENT_ROOT}/dist/assets>
        <IfModule mod_mime.c>
            AddType application/javascript .js
            AddType application/javascript .mjs
            AddType text/css .css
        </IfModule>
        <FilesMatch "\.(js|mjs)$">
            ForceType application/javascript
            Header set Content-Type "application/javascript; charset=utf-8"
        </FilesMatch>
    </Directory>

    # Enable PHP
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>
    
    # Ensure PHP is loaded
    <IfModule mod_php.c>
        php_admin_flag engine on
    </IfModule>

    # Set proper MIME types for JavaScript modules
    <IfModule mod_mime.c>
        # JavaScript files
        AddType application/javascript .js
        AddType application/javascript .mjs
        AddType text/javascript .js .mjs
        
        # TypeScript files (for development)
        AddType application/javascript .ts
        AddType application/javascript .tsx
        AddType text/javascript .ts .tsx
        
        # JSON files
        AddType application/json .json
        
        # CSS files
        AddType text/css .css
        
        # HTML files
        AddType text/html .html .htm
        
        # Font files
        AddType font/woff .woff
        AddType font/woff2 .woff2
        AddType application/font-ttf .ttf
        AddType application/font-otf .otf
    </IfModule>

    # Set charset for JavaScript files (must come after AddType)
    <FilesMatch "\.(js|mjs)$">
        Header set Content-Type "application/javascript; charset=utf-8"
    </FilesMatch>
    
    # Set charset for TypeScript files (for development/source maps)
    <FilesMatch "\.(ts|tsx)$">
        Header set Content-Type "application/javascript; charset=utf-8"
    </FilesMatch>

    # Cache control for HTML files - prevent caching of index.html
    <FilesMatch "index\.html$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </FilesMatch>
    
    # Cache control for assets - allow caching
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000"
    </LocationMatch>

    # Redirect HTTP to HTTPS (optional - uncomment to force HTTPS)
    # RewriteEngine On
    # RewriteCond %{HTTPS} off
    # RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    # Error and access logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
