<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LinkNest - Organize and manage your links and spaces" />
  <title>LinkNest</title>

  <!-- DNS Prefetch for external resources -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">

  <!-- Preconnect for critical resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Preload critical font with font-display swap for better performance -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </noscript>

  <!-- Inline critical CSS moved to index.css to prevent Vite proxy issues -->
  <!-- Initialize style tag and apply cached styles early to prevent style flash on refresh -->
  <script>
    (function () {
      // Create style tag immediately
      let styleTag = document.getElementById('linknest-custom-styles');
      if (!styleTag) {
        styleTag = document.createElement('style');
        styleTag.id = 'linknest-custom-styles';
        document.head.appendChild(styleTag);
      }

      // Try to apply cached styles immediately
      try {
        const cached = localStorage.getItem('linknest_styles_cache');
        const timestamp = localStorage.getItem('linknest_styles_cache_timestamp');

        if (cached && timestamp) {
          const age = Date.now() - parseInt(timestamp, 10);
          // Use cache if less than 5 minutes old
          if (age < 300000) {
            const styles = JSON.parse(cached);
            const isDark = document.documentElement.classList.contains('dark');

            // Generate CSS from cached styles (we need the generateCSS function)
            // For now, we'll just ensure the style tag exists and let React populate it
            // The actual CSS generation will happen in React, but having the tag ready helps
          }
        }
      } catch (error) {
        // Silently fail - React will handle it
      }
    })();
  </script>
  <!-- Browser Launcher Pro Integration Script -->
  <script type="module" src="/land/browser-launcher-integration.js?v=2.0"></script>
</head>

<body>
  <div id="root">
    <div class="loading">Loading...</div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
