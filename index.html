<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LinkNest - Organize and manage your links and spaces" />
  <title>LinkNest</title>

  <!-- DNS Prefetch for external resources -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">

  <!-- Preconnect for critical resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Preload critical font with font-display swap for better performance -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </noscript>

  <!-- Apply theme + cached styles before first paint to avoid refresh jerk -->
  <script>
    (function () {
      try {
        document.documentElement.classList.add('ln-bootstrapping');

        var autoSwitch = localStorage.getItem('linknest_auto_switch');
        var autoEnabled = autoSwitch === null || autoSwitch === 'true';
        var isDark;
        if (autoEnabled) {
          var hour = new Date().getHours();
          isDark = hour >= 18 || hour < 7;
        } else {
          var savedTheme = localStorage.getItem('linknest_theme');
          isDark = savedTheme ? savedTheme === 'dark' : true;
        }

        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        var themeName = localStorage.getItem('linknest_theme_name') || 'default';
        document.documentElement.classList.add('theme-' + themeName);

        var styleTag = document.getElementById('linknest-custom-styles');
        if (!styleTag) {
          styleTag = document.createElement('style');
          styleTag.id = 'linknest-custom-styles';
          document.head.appendChild(styleTag);
        }

        var cssKey = isDark ? 'linknest_styles_css_dark' : 'linknest_styles_css_light';
        var cachedCss = localStorage.getItem(cssKey);
        if (cachedCss) {
          styleTag.textContent = cachedCss;
        } else {
          var zoom = 100;
          var userZoom = localStorage.getItem('linknest_user_page_zoom');
          if (userZoom) {
            zoom = parseInt(userZoom, 10) || 100;
          } else {
            var cachedStyles = localStorage.getItem('linknest_styles_cache');
            if (cachedStyles) {
              try {
                var parsed = JSON.parse(cachedStyles);
                zoom = parsed.pageZoom || 100;
              } catch (e) { /* ignore */ }
            }
          }
          if (!isNaN(zoom) && zoom !== 100) {
            document.documentElement.style.zoom = String(zoom / 100);
          }
        }

        window.addEventListener('load', function () {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              document.documentElement.classList.remove('ln-bootstrapping');
            });
          });
        });
      } catch (error) {
        try {
          document.documentElement.classList.remove('ln-bootstrapping');
        } catch (e) { /* ignore */ }
      }
    })();
  </script>
  <!-- Browser Launcher Pro Integration Script -->
  <script type="module" src="land/browser-launcher-integration.js?v=2.0"></script>
</head>

<body>
  <div id="root">
    <div class="loading">Loading...</div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
