# LinkNest Apache monitoring — loopback-only /server-status vhost
#
# Use this when the main site catch-all (for example Redirect/RewriteRule to
# /iSynergy/) steals /server-status before mod_status can answer (HTTP 302).
# A VirtualHost bound to 127.0.0.1:80 wins over *:80, so PHP's probe to
# http://127.0.0.1/server-status?auto never hits the app rewrite.
#
#   LoadModule status_module modules/mod_status.so
#   Include conf/extra/linknest-server-status.conf
#   Include conf/extra/linknest-server-status-loopback.conf
#
# Requires Listen 80 (already typical). Do not add a second Listen 80.
# Do not copy this inside the public HTTPS vhost.
#
# Alternative: in the vhost/.htaccess that sends traffic to /iSynergy/, add
# immediately above that rule:
#
#   RewriteCond %{REQUEST_URI} !^/server-status

<IfModule status_module>
<VirtualHost 127.0.0.1:80>
    ServerName 127.0.0.1
    # Ignore DocumentRoot .htaccess catch-alls (iSynergy, SPA fallback, etc.)
    <Directory />
        AllowOverride None
    </Directory>
    <IfModule rewrite_module>
        RewriteEngine Off
    </IfModule>
    ExtendedStatus On
    <Location /server-status>
        SetHandler server-status
        Require local
    </Location>
</VirtualHost>
</IfModule>
