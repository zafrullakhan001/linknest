# LinkNest SSH/VNC gateway WebSocket proxy for XAMPP / office HTTPS.
#
# Problem: https://… pages cannot open ws://host:17681 (Mixed Content blocked).
# Fix: terminate TLS on Apache :443 and proxy:
#   wss://host/_ln_sshgw/<port>/ws
#   wss://host/<AnyFolder>/_ln_sshgw/<port>/ws     (e.g. /ArchLinks, /ERP3, /linknest)
#   wss://host/<AnyFolder>/_ln_vncgw/<port>/websockify
#
# Port ranges match api/ssh_gateway.php + api/vnc_gateway.php defaults:
#   SSH ttyd: 17681–18680
#   VNC websockify: 19000–19999
#
# IMPORTANT: use non-capturing (?:…) groups inside the port pattern so $1=port
# and $2=path. Nested (...) groups would steal $2 and break the proxy.
#
# Requires modules: rewrite, proxy, proxy_http, proxy_wstunnel
# Include inside the HTTPS VirtualHost (or globally via httpd.conf):
#   Include conf/extra/linknest-gateway-proxy.conf
#
# Enable with: powershell -File scripts\enable-gateway-wss-proxy.ps1

ProxyRequests Off
ProxyPreserveHost Off
ProxyTimeout 3600

<IfModule mod_rewrite.c>
    RewriteEngine On

    # Optional one-segment app folder before /_ln_sshgw|/_ln_vncgw (any name)
    # SSH ttyd ports 17681–18680 (non-capturing inner groups — $1=port, $2=rest)
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteRule ^(?:/[^/]+)?/_ln_sshgw/(176(?:8[1-9]|9[0-9])|17[7-9][0-9]{2}|18[0-5][0-9]{2}|186(?:[0-7][0-9]|80))/(.*)$ ws://127.0.0.1:$1/$2 [P,L]

    RewriteRule ^(?:/[^/]+)?/_ln_sshgw/(176(?:8[1-9]|9[0-9])|17[7-9][0-9]{2}|18[0-5][0-9]{2}|186(?:[0-7][0-9]|80))/(.*)$ http://127.0.0.1:$1/$2 [P,L]

    # VNC websockify ports 19000–19999
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteRule ^(?:/[^/]+)?/_ln_vncgw/(19[0-9]{3})/(.*)$ ws://127.0.0.1:$1/$2 [P,L]

    RewriteRule ^(?:/[^/]+)?/_ln_vncgw/(19[0-9]{3})/(.*)$ http://127.0.0.1:$1/$2 [P,L]
</IfModule>
