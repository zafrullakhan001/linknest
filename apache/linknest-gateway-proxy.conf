# LinkNest SSH/VNC gateway WebSocket proxy
#
# Include this ONCE inside the HTTPS VirtualHost (httpd-ssl.conf), NOT also from
# global httpd.conf (double Include breaks MFA with "broken close frame";
# global-only Include often does nothing for :443 VirtualHosts).
#
# Browser: wss://host/<folder>/_ln_sshgw/<port>/ws
# Backend: ws://127.0.0.1:<port>/ws

ProxyRequests Off
ProxyPreserveHost Off
ProxyTimeout 3600

<IfModule mod_rewrite.c>
    RewriteEngine On

    # SSH ttyd 17681-18680 - WebSocket upgrade only
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/(?:[^/]+/)?_ln_sshgw/(176(?:8[1-9]|9[0-9])|17[7-9][0-9]{2}|18[0-5][0-9]{2}|186(?:[0-7][0-9]|80))/(.*)$ "ws://127.0.0.1:$1/$2" [P,L]

    # Non-WS probes (optional)
    RewriteCond %{HTTP:Upgrade} !websocket [NC]
    RewriteRule ^/(?:[^/]+/)?_ln_sshgw/(176(?:8[1-9]|9[0-9])|17[7-9][0-9]{2}|18[0-5][0-9]{2}|186(?:[0-7][0-9]|80))/(.*)$ "http://127.0.0.1:$1/$2" [P,L]

    # VNC 19000-19999
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/(?:[^/]+/)?_ln_vncgw/(19[0-9]{3})/(.*)$ "ws://127.0.0.1:$1/$2" [P,L]

    RewriteCond %{HTTP:Upgrade} !websocket [NC]
    RewriteRule ^/(?:[^/]+/)?_ln_vncgw/(19[0-9]{3})/(.*)$ "http://127.0.0.1:$1/$2" [P,L]
</IfModule>
