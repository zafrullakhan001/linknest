# LinkNest SSH/VNC gateway WebSocket proxy
#
# Include ONCE inside the HTTPS VirtualHost (httpd-ssl.conf) only.
#
# Browser: wss://host/<folder>/_ln_sshgw/<port>/ws
# Backend: ws://127.0.0.1:<port>/ws

ProxyRequests Off
ProxyPreserveHost Off
ProxyTimeout 3600
Timeout 3600

# HTTP/2 breaks many WebSocket proxies (broken close frames after MFA).
# Force HTTP/1.1 for gateway paths only.
<IfModule mod_http2.c>
    <LocationMatch "^/(?:[^/]+/)?_ln_(?:ssh|vnc)gw/">
        Protocols http/1.1
    </LocationMatch>
</IfModule>

<IfModule mod_proxy_wstunnel.c>
    # Prefer dedicated WS tunnel (ws:// triggers mod_proxy_wstunnel)
    ProxyPassMatch "^/(?:[^/]+/)?_ln_sshgw/(176(?:8[1-9]|9[0-9])|17[7-9][0-9]{2}|18[0-5][0-9]{2}|186(?:[0-7][0-9]|80))/(.*)$" "ws://127.0.0.1:$1/$2" retry=0 timeout=3600 disablereuse=On
    ProxyPassMatch "^/(?:[^/]+/)?_ln_vncgw/(19[0-9]{3})/(.*)$" "ws://127.0.0.1:$1/$2" retry=0 timeout=3600 disablereuse=On
</IfModule>

<IfModule !mod_proxy_wstunnel.c>
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{HTTP:Upgrade} websocket [NC]
        RewriteRule ^/(?:[^/]+/)?_ln_sshgw/(176(?:8[1-9]|9[0-9])|17[7-9][0-9]{2}|18[0-5][0-9]{2}|186(?:[0-7][0-9]|80))/(.*)$ "ws://127.0.0.1:$1/$2" [P,L]
        RewriteCond %{HTTP:Upgrade} websocket [NC]
        RewriteRule ^/(?:[^/]+/)?_ln_vncgw/(19[0-9]{3})/(.*)$ "ws://127.0.0.1:$1/$2" [P,L]
    </IfModule>
</IfModule>
