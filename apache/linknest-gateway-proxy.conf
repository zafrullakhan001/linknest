# LinkNest SSH/VNC gateway WebSocket proxy for XAMPP / office HTTPS.
#
# Browser:  wss://host/<optional-folder>/_ln_sshgw/<port>/ws
# Backend:  ws://127.0.0.1:<port>/ws   (ttyd)
#
# Include this file ONCE (httpd.conf OR the SSL VirtualHost - not both).
# Double-Include + .htaccess [P] causes broken WebSocket close frames.
#
# Enable: powershell -File scripts\enable-gateway-wss-proxy.ps1

ProxyRequests Off
ProxyPreserveHost Off
ProxyTimeout 3600

# Prefer dedicated WebSocket tunnel module when available
<IfModule mod_proxy_wstunnel.c>
    # SSH ttyd 17681-18680 (optional one-segment folder prefix)
    ProxyPassMatch "^/(?:[^/]+/)?_ln_sshgw/(176(?:8[1-9]|9[0-9])|17[7-9][0-9]{2}|18[0-5][0-9]{2}|186(?:[0-7][0-9]|80))/(.*)$" "ws://127.0.0.1:$1/$2" retry=0 timeout=3600
    # VNC websockify 19000-19999
    ProxyPassMatch "^/(?:[^/]+/)?_ln_vncgw/(19[0-9]{3})/(.*)$" "ws://127.0.0.1:$1/$2" retry=0 timeout=3600
</IfModule>

# Fallback when only rewrite+[P] is available (do NOT also ProxyPassMatch the same paths)
<IfModule !mod_proxy_wstunnel.c>
    <IfModule mod_rewrite.c>
        RewriteEngine On

        # WebSocket upgrades only -> ws://
        RewriteCond %{HTTP:Upgrade} websocket [NC]
        RewriteCond %{HTTP:Connection} upgrade [NC]
        RewriteRule ^/(?:[^/]+/)?_ln_sshgw/(176(?:8[1-9]|9[0-9])|17[7-9][0-9]{2}|18[0-5][0-9]{2}|186(?:[0-7][0-9]|80))/(.*)$ ws://127.0.0.1:$1/$2 [P,L]

        RewriteCond %{HTTP:Upgrade} !websocket [NC]
        RewriteRule ^/(?:[^/]+/)?_ln_sshgw/(176(?:8[1-9]|9[0-9])|17[7-9][0-9]{2}|18[0-5][0-9]{2}|186(?:[0-7][0-9]|80))/(.*)$ http://127.0.0.1:$1/$2 [P,L]

        RewriteCond %{HTTP:Upgrade} websocket [NC]
        RewriteCond %{HTTP:Connection} upgrade [NC]
        RewriteRule ^/(?:[^/]+/)?_ln_vncgw/(19[0-9]{3})/(.*)$ ws://127.0.0.1:$1/$2 [P,L]

        RewriteCond %{HTTP:Upgrade} !websocket [NC]
        RewriteRule ^/(?:[^/]+/)?_ln_vncgw/(19[0-9]{3})/(.*)$ http://127.0.0.1:$1/$2 [P,L]
    </IfModule>
</IfModule>
