# LinkNest Apache monitoring (mod_status)
#
# Loopback only. The admin dashboard fetches /server-status?auto from PHP
# on 127.0.0.1 (or the public hostname forced to 127.0.0.1). Never expose
# this Location to the public internet.
#
# Works on vanilla Apache (D:\Apache, C:\Apache24, Linux httpd) as well as
# XAMPP. XAMPP often already includes conf/extra/httpd-info.conf.
#
#   LoadModule status_module modules/mod_status.so
#   Include conf/extra/linknest-server-status.conf
#
# If a vhost redirects HTTP → HTTPS, skip this path so PHP can still probe
# loopback without following a public redirect:
#
#   RewriteCond %{REQUEST_URI} !^/server-status
#
# Apache must accept connections on 127.0.0.1 for the same listen port
# (a blanket `Listen 443` does; `Listen 10.x.x.x:443` only does not).

<IfModule status_module>
    ExtendedStatus On

    <Location /server-status>
        SetHandler server-status
        Require local
    </Location>
</IfModule>
