; LinkNest recommended OPcache settings for XAMPP (Apache SAPI)
; Applied by scripts/apply-xampp-performance.ps1 into C:\xampp\php\php.ini
;
; Note: opcache.enable_cli=0 is intentional — CLI status may show "not loaded"
; while Apache (mod_php) still has OPcache active. Verify via /check_opcache.php

[opcache]
zend_extension=opcache
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.max_wasted_percentage=10
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.revalidate_path=0
opcache.fast_shutdown=1
opcache.enable_file_override=1
opcache.save_comments=1
