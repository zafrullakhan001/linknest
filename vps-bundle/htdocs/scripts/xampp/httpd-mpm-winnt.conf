# LinkNest recommended Apache MPM for XAMPP on Windows (mpm_winnt)
# Applied by scripts/apply-xampp-performance.ps1 into
#   C:\xampp\apache\conf\extra\httpd-mpm.conf
#
# On Windows mpm_winnt, MaxRequestWorkers is not a valid directive —
# concurrent capacity is ThreadsPerChild (one process, N threads).

<IfModule mpm_winnt_module>
    ThreadsPerChild        256
    MaxConnectionsPerChild 10000
</IfModule>
