; LinkNest — dedicated PHP-FPM pool (template for VPS deploys)
; Rendered by scripts/vps/step20-php-fpm.sh into
;   /etc/php/__PHP_VER__/fpm/pool.d/__POOL__.conf
;
; Sizing note: api/config.php raises SQLite PRAGMA cache_size to ~2x the DB file,
; so children are deliberately capped on small hosts. Raise pm.max_children only
; after checking `free -m` and per-worker RSS.

[__POOL__]
user = __APP_USER__
group = __APP_USER__
listen = __FPM_SOCKET__
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = __MAX_CHILDREN__
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 300
pm.process_idle_timeout = 10s
request_terminate_timeout = 300

php_admin_value[memory_limit] = __MEMORY_LIMIT__
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size] = 110M
php_admin_value[max_execution_time] = 120
php_admin_value[expose_php] = off
php_admin_value[session.save_path] = __SESSIONS_DIR__
php_admin_flag[log_errors] = on

; Media library / gateway helpers expect a writable HOME
env[HOME] = __HOME_DIR__

catch_workers_output = yes
