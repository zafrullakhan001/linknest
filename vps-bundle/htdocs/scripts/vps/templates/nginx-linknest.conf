# LinkNest — https://__DOMAIN__ (template for VPS deploys)
# Rendered by scripts/vps/step30-nginx.sh into /etc/nginx/sites-available/__SITE__
# Layout mirrors the XAMPP/Apache install: the project root is the docroot,
# dist/ holds the built SPA, api/ holds the PHP API.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt HTTP-01 challenge (must stay reachable over plain HTTP)
    location ^~ /.well-known/acme-challenge/ {
        root __APP_ROOT__;
        default_type "text/plain";
        allow all;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root __APP_ROOT__;
    index dist/index.html;
    charset utf-8;
    autoindex off;

    client_max_body_size 128M;
    client_body_timeout 120s;

    access_log /var/log/nginx/__SITE__.access.log;
    error_log  /var/log/nginx/__SITE__.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml application/xml application/wasm;

    # ---------- private / internal paths (^~ beats regex locations) ----------
    location ^~ /data/       { deny all; }   # SQLite DB, snapshots, exports, cache
    location ^~ /logs/       { deny all; }
    location ^~ /config/     { deny all; }
    location ^~ /scripts/    { deny all; }
    location ^~ /vendor/     { deny all; }
    location ^~ /analytics/  { deny all; }
    location ^~ /migrations/ { deny all; }
    location ^~ /monitorv2/  { deny all; }

    # ---------- API front controller (Apache .htaccess parity) ----------
    location /api/ { try_files $uri /api/index.php$is_args$args; }

    # ---------- uploads: static only ----------
    location /uploads/ { try_files $uri =404; }

    # ---------- built SPA (dist/ is exposed as /) ----------
    location = /                { rewrite ^ /dist/index.html last; }
    location = /index.html      { rewrite ^ /dist/index.html last; }
    location = /dist/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location ^~ /assets/   { try_files $uri /dist$uri =404; }
    location ^~ /tinymce/  { try_files $uri /dist$uri =404; }
    location = /robots.txt { try_files $uri /dist$uri =404; }

    location = /vendor/mermaid.min.js { try_files /dist/vendor/mermaid.min.js =404; }

    location = /ln-boot-theme.js             { try_files /dist/ln-boot-theme.js =404;
                                               add_header Cache-Control "no-cache, must-revalidate"; }
    location = /ln-load-browser-launcher.js  { try_files /dist/ln-load-browser-launcher.js =404;
                                               add_header Cache-Control "no-cache, must-revalidate"; }
    location = /sw-cache-first.js            { try_files /dist/sw-cache-first.js =404;
                                               add_header Cache-Control "no-cache, must-revalidate"; }
    location = /ssh-session-shared-worker.js { try_files /dist/ssh-session-shared-worker.js =404;
                                               add_header Cache-Control "no-cache, must-revalidate"; }
    location = /ssh-session-keepalive.html   { try_files /dist/ssh-session-keepalive.html =404; }
    location = /tinymce-editor.html          { try_files /dist/tinymce-editor.html =404; }

    # ---------- recyclable short URLs ----------
    location ^~ /s/ { rewrite ^/s/(.*)$ /s.php?code=$1 last; }

    # ---------- legacy absolute paths stored in imported databases ----------
    location ^~ /linknest/uploads/ { alias __APP_ROOT__/uploads/; }
    location ^~ /linknest/api/     { rewrite ^/linknest/api/(.*)$ /api/$1 last; }
    location = /linknest           { return 301 /; }
    location = /linknest/          { return 301 /; }

    # ---------- regex locations (order matters) ----------
    location ~* ^/uploads/.*\.(?:php|phtml|phar|php[0-9])$ { return 403; }   # no PHP in uploads
    location ~ /\.(?!well-known) { deny all; }                              # dotfiles

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__FPM_SOCKET__;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;   # MCP bearer tokens
        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~* \.(?:js|mjs|css|map|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp|mp4|webm)$ {
        try_files $uri /dist$uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---------- SPA shell fallback (app is hash-routed) ----------
    location / { try_files $uri /dist/index.html; }
}
