<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkNest Bookmark Sync</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      width: 300px;
      font: 13px/1.45 system-ui, Segoe UI, sans-serif;
      color: #0f172a;
      background: #f8fafc;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #e2e8f0; background: #0f172a; }
      .muted { color: #94a3b8 !important; }
      .card, .tabs { background: #1e293b; border-color: #334155; }
      .tab { color: #94a3b8; }
      .tab.active { background: #0f172a; color: #e2e8f0; }
      button.primary { background: #0284c7; }
      button.secondary {
        background: transparent;
        color: #e2e8f0;
        border-color: #334155;
      }
      input[type="text"] {
        background: #0f172a;
        border-color: #334155;
        color: #e2e8f0;
      }
    }
    header {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px 14px 8px;
    }
    header img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: cover;
      background: #e2e8f0;
    }
    h1 { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
    .muted { margin: 2px 0 0; color: #64748b; font-size: 12px; }
    .tabs {
      display: flex;
      gap: 4px;
      margin: 0 12px 10px;
      padding: 3px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background: #fff;
    }
    .tab {
      flex: 1;
      margin: 0;
      width: auto;
      padding: 6px 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #64748b;
      font-weight: 600;
      font-size: 12px;
    }
    .tab.active { background: #f1f5f9; color: #0f172a; }
    .card {
      margin: 0 12px 12px;
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background: #fff;
    }
    .count { font-size: 22px; font-weight: 700; }
    ol { margin: 0; padding-left: 18px; }
    li { margin: 4px 0; }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 8px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font: inherit;
    }
    .logo-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #brand-preview {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
      background: #e2e8f0;
      flex-shrink: 0;
    }
    .logo-actions { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .logo-actions button {
      width: auto;
      margin: 0;
      padding: 6px 8px;
      font-size: 12px;
    }
    button {
      display: block;
      width: calc(100% - 24px);
      margin: 0 12px 10px;
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      background: #0284c7;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary { background: #0284c7; color: #fff; }
    button.secondary {
      background: #fff;
      color: #334155;
      border: 1px solid #e2e8f0;
    }
    button:disabled { opacity: .55; cursor: default; }
    .err { color: #b91c1c; }
    .ok { color: #047857; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <img id="header-logo" src="icons/icon48.png" alt="">
    <div>
      <h1 id="header-name">LinkNest Bookmark Sync</h1>
      <p class="muted" id="version">v1.1.0 · bookmarks only</p>
    </div>
  </header>

  <nav class="tabs" aria-label="Popup sections">
    <button type="button" class="tab active" data-tab="sync">Sync</button>
    <button type="button" class="tab" data-tab="branding">Branding</button>
  </nav>

  <section id="panel-sync">
    <div class="card">
      <div class="count" id="count">…</div>
      <p class="muted" id="status">Reading bookmarks…</p>
    </div>
    <div class="card">
      <ol>
        <li>Open LinkNest in this browser</li>
        <li>Favorites → Your Bookmarks</li>
        <li>Click <strong>Sync</strong></li>
      </ol>
    </div>
    <button type="button" class="primary" id="refresh">Refresh count</button>
  </section>

  <section id="panel-branding" hidden>
    <div class="card">
      <label for="brand-name">Display name</label>
      <input id="brand-name" type="text" maxlength="48" placeholder="Any name you want" autocomplete="off">
    </div>
    <div class="card">
      <label>Logo</label>
      <div class="logo-row">
        <img id="brand-preview" src="icons/icon48.png" alt="Logo preview">
        <div class="logo-actions">
          <button type="button" class="secondary" id="pick-logo">Choose image…</button>
          <button type="button" class="secondary" id="clear-logo">Remove logo</button>
          <input id="logo-file" type="file" accept="image/*" hidden>
        </div>
      </div>
    </div>
    <p class="muted" style="margin: 0 14px 10px;">
      Used in this popup and the toolbar icon. Chrome’s extensions page still shows the packaged name.
    </p>
    <button type="button" class="primary" id="save-brand">Save branding</button>
    <button type="button" class="secondary" id="reset-brand">Reset to default</button>
    <p class="muted" id="brand-msg" style="margin: 0 14px 12px;"></p>
  </section>

  <script src="branding.js"></script>
  <script src="popup.js"></script>
</body>
</html>
