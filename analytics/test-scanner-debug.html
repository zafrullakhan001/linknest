<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Scanner Debug Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        .log { margin: 5px 0; padding: 5px; }
        .success { color: #4ec9b0; }
        .error { color: #f48771; }
        .info { color: #569cd6; }
        #console { background: #252526; padding: 15px; border-radius: 5px; max-height: 500px; overflow-y: auto; }
        a { color: #4ec9b0; display: block; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🔍 Scanner Debug Test</h1>
    
    <h2>Test Links:</h2>
    <a href="https://google.com">Google</a>
    <a href="https://github.com">GitHub</a>
    <a href="https://example.com">Example</a>
    
    <h2>Console Output:</h2>
    <div id="console"></div>

    <script>
        function log(msg, type = 'info') {
            const console = document.getElementById('console');
            const div = document.createElement('div');
            div.className = 'log ' + type;
            div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            console.appendChild(div);
            console.scrollTop = console.scrollHeight;
            console.log(msg);
        }
        
        // Set up config BEFORE script loads
        window.ANALYTICS_CONFIG = {
            enabled: true,
            sampleRate: 1.0,
            collectUrl: 'http://localhost:9333/api/metrics/collect',
            apiUrl: 'http://localhost:9333/api',
            userId: 1,
            sessionId: 'debug-' + Date.now(),
            beaconUrls: [],
            countryCode: 'US',
            region: 'Test',
            city: 'Test',
            latitude: 0,
            longitude: 0
        };
        
        log('ANALYTICS_CONFIG set', 'success');
        log('Config: ' + JSON.stringify(window.ANALYTICS_CONFIG), 'info');
        
        // Monitor script loading
        const scripts = document.getElementsByTagName('script');
        log('Total scripts on page: ' + scripts.length, 'info');
        
        // Override console.log to capture all analytics messages
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const msg = args.join(' ');
            if (msg.includes('[Analytics]') || msg.includes('LinkLatencyScanner')) {
                log(msg, 'info');
            }
        };
        
        // Monitor fetch/beacon calls
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
            if (args[0] && args[0].includes('/api/metrics/collect')) {
                log('FETCH: Sending to ' + args[0], 'info');
                return originalFetch.apply(this, args)
                    .then(r => {
                        log('FETCH: Response ' + r.status, r.ok ? 'success' : 'error');
                        return r;
                    });
            }
            return originalFetch.apply(this, args);
        };
        
        const originalSendBeacon = navigator.sendBeacon;
        navigator.sendBeacon = function(url, data) {
            if (url.includes('/api/metrics/collect')) {
                log('BEACON: Sending to ' + url, 'info');
            }
            return originalSendBeacon.apply(navigator, arguments);
        };
        
        // Check periodically for class
        let checkCount = 0;
        const checkInterval = setInterval(() => {
            checkCount++;
            if (typeof LinkLatencyScanner !== 'undefined') {
                log('✓ LinkLatencyScanner class found!', 'success');
                clearInterval(checkInterval);
                
                try {
                    const scanner = new LinkLatencyScanner(window.ANALYTICS_CONFIG);
                    log('✓ Scanner instantiated', 'success');
                    const links = scanner.findLinks();
                    log('Found ' + links.length + ' links: ' + links.join(', '), 'info');
                } catch (e) {
                    log('✗ Error: ' + e.message, 'error');
                }
            } else {
                if (checkCount <= 10) {
                    log('Waiting for LinkLatencyScanner... (' + checkCount + ')', 'info');
                } else {
                    log('✗ LinkLatencyScanner still not found after 10 checks', 'error');
                    clearInterval(checkInterval);
                }
            }
        }, 500);
        
        log('Page loaded, monitoring...', 'info');
    </script>
    
    <!-- Load script -->
    <script src="dashboard/link-latency-scanner.js" defer onload="console.log('Script onload fired')" onerror="console.error('Script onerror fired')"></script>
    
    <script>
        window.addEventListener('load', () => {
            log('Window load event fired', 'info');
            log('Document readyState: ' + document.readyState, 'info');
            log('LinkLatencyScanner available: ' + (typeof LinkLatencyScanner !== 'undefined'), 
                typeof LinkLatencyScanner !== 'undefined' ? 'success' : 'error');
        });
    </script>
</body>
</html>
