# Apache Virtual Host Configuration for Performance Analytics Dashboard
# Port 9333 with CORS support
#
# Installation Instructions:
# 1. Copy this file to: C:\xampp\apache\conf\extra\httpd-vhost-analytics.conf
# 2. Edit C:\xampp\apache\conf\httpd.conf and add:
#    Include conf/extra/httpd-vhost-analytics.conf
# 3. Restart Apache
#
# Or simply add the <VirtualHost> block below to your existing httpd-vhosts.conf file

# Listen on port 9333
Listen 9333

<VirtualHost *:9333>
    # Server configuration
    ServerName localhost
    ServerAdmin admin@localhost
    DocumentRoot "C:/xampp/htdocs/linknest/analytics"
    
    # Logging
    ErrorLog "C:/xampp/apache/logs/analytics-error.log"
    CustomLog "C:/xampp/apache/logs/analytics-access.log" common
    
    # CORS Headers (required for cross-origin beacon requests from main app)
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "POST, GET, OPTIONS, PUT, DELETE"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization"
    Header always set Access-Control-Max-Age "3600"
    
    # Handle OPTIONS preflight requests
    <If "%{REQUEST_METHOD} == 'OPTIONS'">
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "POST, GET, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type"
        RequestHeader set Access-Control-Request-Method "GET"
    </If>
    
    # Directory configuration
    <Directory "C:/xampp/htdocs/linknest/analytics">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
        
        # Enable rewrite engine for API routing
        RewriteEngine On
        
        # Route API requests to appropriate PHP files
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^api/metrics/collect$ api/metrics/collect.php [L,QSA]
        RewriteRule ^api/performance/([^/]+)$ api/performance/$1.php [L,QSA]
        
        # Serve dashboard as default
        DirectoryIndex dashboard/index.html index.html index.php
    </Directory>
    
    # PHP configuration for this virtualhost
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>
</VirtualHost>
